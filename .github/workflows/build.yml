name: Build AurexaTag

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Compilation
        run: mvn -B package

      - name: Envoi du jar
        uses: actions/upload-artifact@v4
        with:
          name: AurexaTag
          path: target/*.jar
